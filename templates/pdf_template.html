<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ACA Plan Recommendations</title>
    <style>
        @page {
            size: A4;
            margin: 0.75in;
            @bottom-right {
                content: "Page " counter(page) " of " counter(pages);
            }
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11pt;
            line-height: 1.4;
            color: #333;
        }
        
        .header {
            border-bottom: 3px solid #2c5aa0;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        
        .company-name {
            font-size: 24pt;
            font-weight: bold;
            color: #2c5aa0;
            margin-bottom: 5px;
        }
        
        .agent-info {
            font-size: 10pt;
            color: #666;
        }
        
        .client-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 14pt;
            font-weight: bold;
            color: #2c5aa0;
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        
        .plan-card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
            page-break-inside: avoid;
        }
        
        .plan-rank {
            background-color: #2c5aa0;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .plan-title {
            font-size: 13pt;
            font-weight: bold;
            color: #2c5aa0;
            margin-bottom: 8px;
        }
        
        .premium-highlight {
            font-size: 18pt;
            font-weight: bold;
            color: #28a745;
            margin: 10px 0;
        }
        
        .disclaimer {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 5px;
            margin-top: 25px;
            font-size: 10pt;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 9pt;
            color: #666;
        }
    </style>
</head>
<body>
    <!-- PDF template content would go here -->
    <!-- This is just a reference template structure -->
</body>
</html>
